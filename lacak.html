<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lacak Kurir - Tukang Sayur Online</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5fff5;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
        }

        #status {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* WAJIB ADA TINGGI */
        #map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            border: 2px solid #2e7d32;
        }

        .btn-kembali {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 10px 20px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚚 Lacak Kurir</h1>
</header>

<div class="container">

    <h2>Lokasi Kurir</h2>

    <p id="status">
        📍 Menampilkan peta Malang...
    </p>

    <div id="map"></div>

    <a href="riwayat.html" class="btn-kembali">
        ← Kembali ke Riwayat
    </a>

</div>

<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    // Titik awal Kota Malang
    const malang = [-7.9797, 112.6304];

    // Membuat peta
    const map = L.map("map").setView(malang, 13);

    // Tampilan peta OpenStreetMap
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // Marker awal
    const marker = L.marker(malang)
        .addTo(map)
        .bindPopup("📍 Kota Malang")
        .openPopup();

    document.getElementById("status").innerHTML =
        "📍 Peta berhasil dimuat. Menampilkan area Kota Malang.";

</script>

</body>
</html>
