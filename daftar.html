<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - Tukang Sayur Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.jpg" alt="Logo">
        <h2>Tukang Sayur Online</h2>
    </div>

    <nav>
        <a href="login.html">Login</a>
    </nav>

</header>


<div class="login-container">

    <div class="login-box">

        <h2>DAFTAR AKUN</h2>

        <p>Buat akun pelanggan baru</p>

        <form id="formDaftar">

            <label for="nama">Nama Lengkap</label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap"
                required
            >


            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan email"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimal 6 karakter"
                minlength="6"
                required
            >


            <label for="password2">Konfirmasi Password</label>

            <input
                type="password"
                id="password2"
                placeholder="Masukkan ulang password"
                minlength="6"
                required
            >


            <button type="submit">
                DAFTAR
            </button>

        </form>


        <p class="daftar">
            Sudah punya akun?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>


<footer>
    <p>© 2026 Tukang Sayur Online</p>
</footer>


<script type="module">

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import { app } from "./firebase-config.js";


    const auth = getAuth(app);

    const form = document.getElementById("formDaftar");


    form.addEventListener("submit", async function(e) {

        e.preventDefault();


        const nama =
            document.getElementById("nama").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const password2 =
            document.getElementById("password2").value;


        if (password !== password2) {

            alert("Konfirmasi password tidak sama!");

            return;
        }


        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            await updateProfile(
                userCredential.user,
                {
                    displayName: nama
                }
            );


            alert("Akun berhasil dibuat! Silakan login.");

            window.location.href = "login.html";


        } catch (error) {

            console.error(error);

            if (error.code === "auth/email-already-in-use") {

                alert("Email tersebut sudah terdaftar.");

            } else if (error.code === "auth/invalid-email") {

                alert("Format email tidak valid.");

            } else if (error.code === "auth/weak-password") {

                alert("Password terlalu lemah. Gunakan minimal 6 karakter.");

            } else {

                alert("Pendaftaran gagal. Silakan coba lagi.");

            }

        }

    });

</script>

</body>
</html>
