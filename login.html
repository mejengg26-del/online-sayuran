<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tukang Sayur Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.jpg" alt="Logo">
        <h2>Tukang Sayur Online</h2>
    </div>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="kategori.html">Kategori</a>
        <a href="stook.html">Stok</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="checkout.html">Checkout</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<div class="login-container">

    <div class="login-box">

        <h2>LOGIN</h2>

        <p>Silakan masuk ke akun Anda</p>

        <form id="loginForm">

            <label for="role">Login Sebagai</label>

            <select id="role" required>
                <option value="">Pilih Role</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>


            <label for="username">Username / Email</label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan Username"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan Password"
                required
            >


            <button type="submit">LOGIN</button>

        </form>

        <p class="daftar">
    Belum punya akun?
    <a href="daftar.html">Daftar Sekarang</a>
</p>

    </div>

</div>


<footer>

    <p>© 2026 Tukang Sayur Online</p>

</footer>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();


    if (role === "") {
        alert("Silakan pilih role terlebih dahulu.");
        return;
    }


    if (username === "" || password === "") {
        alert("Username dan password wajib diisi.");
        return;
    }


    /* =========================
       LOGIN USER
       ========================= */

    if (role === "User") {

        localStorage.setItem("loginUser", "true");
        localStorage.setItem("usernameUser", username);

        alert("Login sebagai pelanggan berhasil!");

        window.location.href = "index.html";

        return;
    }


    /* =========================
       LOGIN ADMIN
       ========================= */

    if (role === "Admin") {

        /*
         * Akun admin sementara
         * Bisa kita ganti nanti
         */

        if (username === "admin" && password === "admin123") {

            localStorage.setItem("loginAdmin", "true");
            localStorage.setItem("usernameAdmin", username);

            alert("Login Admin berhasil!");

            window.location.href = "admin.html";

        } else {

            alert("Username atau password Admin salah.");

        }

    }

});

</script>

</body>
</html>
