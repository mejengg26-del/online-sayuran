<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CEO - Tukang Sayur Online</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5fff5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #256b2a;
        }

        .kembali {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Login CEO</h2>
    <p>Tukang Sayur Online</p>

    <form id="formCEO">

        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required>

        <button type="submit">Login</button>

    </form>

    <a href="index.html" class="kembali">← Kembali ke Beranda</a>

</div>

<script>

document.getElementById("formCEO").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    /*
       Akun CEO sementara untuk prototype
    */

    if (username === "ceo" && password === "ceo123") {

        localStorage.setItem("loginCEO", "true");

        alert("Login CEO berhasil!");

        window.location.href = "ceo.html";

    } else {

        alert("Username atau password CEO salah!");

    }

});

</script>

</body>
</html>
