<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tukang Sayur Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.jpg" alt="Logo">
        <h2>Tukang Sayur Online</h2>
    </div>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="kategori.html">Kategori</a>
        <a href="stook.html">stook</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="checkout.html">Checkout</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<div class="checkout-container">

    <div class="checkout-box">

        <h2>🛒 Checkout</h2>

        <form>

            <label>Nama Pelanggan</label>
            <input
                type="text"
                id="namaPelanggan"
                placeholder="Masukkan nama lengkap"
            >

            <label>Nomor HP</label>
            <input
                type="text"
                id="nomorHP"
                placeholder="Masukkan nomor HP"
            >

            <label>Alamat Pengiriman</label>
            <textarea
                id="alamat"
                placeholder="Masukkan alamat lengkap"
            ></textarea>

            <label>Metode Pembayaran</label>

            <select id="metodePembayaran">
                <option>COD (Bayar di Tempat)</option>
                <option>Transfer Bank</option>
                <option>QRIS</option>
            </select>


            <h3>Ringkasan Pesanan</h3>

            <table>

                <thead>
                    <tr>
                        <th>Produk</th>
                        <th>Jumlah</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>

                <tbody id="checkoutList">
                </tbody>

                <tfoot>
                    <tr>
                        <th colspan="2">Total</th>
                        <th id="totalCheckout">Rp0</th>
                    </tr>
                </tfoot>

            </table>


            <button type="button" onclick="pesanSekarang()">
                Pesan Sekarang
            </button>

        </form>

    </div>

</div>


<!-- =========================================
     MENAMPILKAN RINGKASAN PESANAN
========================================= -->

<script>

let keranjang = JSON.parse(localStorage.getItem("keranjang")) || [];

let isi = "";
let total = 0;

keranjang.forEach(item => {

    let subtotal = item.harga * item.jumlah;

    total += subtotal;

    isi += `
    <tr>
        <td>${item.nama}</td>
        <td>${item.jumlah} ikat</td>
        <td>Rp${subtotal.toLocaleString('id-ID')}</td>
    </tr>
    `;

});

document.getElementById("checkoutList").innerHTML = isi;

document.getElementById("totalCheckout").innerHTML =
    "Rp" + total.toLocaleString('id-ID');

</script>


<!-- =========================================
     FIREBASE FIRESTORE
========================================= -->

<script type="module">

import {
    collection,
    addDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    db
} from "./firebase-config.js";


window.pesanSekarang = async function() {

    // Ambil data pelanggan
    const nama = document.getElementById("namaPelanggan").value.trim();
    const hp = document.getElementById("nomorHP").value.trim();
    const alamat = document.getElementById("alamat").value.trim();
    const pembayaran =
        document.getElementById("metodePembayaran").value;


    // Cek data pelanggan
    if (nama === "" || hp === "" || alamat === "") {

        alert("Mohon lengkapi data pelanggan terlebih dahulu.");

        return;
    }


    // Ambil keranjang
    const keranjang =
        JSON.parse(localStorage.getItem("keranjang")) || [];


    // Cek keranjang
    if (keranjang.length === 0) {

        alert("Keranjang masih kosong.");

        return;
    }


    // Hitung total
    let total = 0;

    keranjang.forEach(item => {

        total += item.harga * item.jumlah;

    });


    try {

        // Simpan pesanan ke Firebase
        await addDoc(
            collection(db, "pesanan"),
            {
                namaPelanggan: nama,
                nomorHP: hp,
                alamat: alamat,
                metodePembayaran: pembayaran,
                pesanan: keranjang,
                total: total,
                status: "Menunggu",
                tanggal: new Date().toISOString()
            }
        );


        alert("Pesanan berhasil dibuat!");


        // Hapus keranjang setelah berhasil
        localStorage.removeItem("keranjang");


        // Kembali ke halaman utama
        window.location.href = "index.html";


    } catch (error) {

        console.error("Error menyimpan pesanan:", error);

        alert(
            "Pesanan gagal disimpan. Silakan coba lagi."
        );

    }

};

</script>


<!-- =========================================
     SCRIPT WEBSITE
========================================= -->

<script src="script.js"></script>


</body>
</html>
