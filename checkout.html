<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Tukang Sayur Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.jpg" alt="Logo">
        <h2>Tukang Sayur Online</h2>
    </div>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="kategori.html">Kategori</a>
        <a href="stook.html">stook</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="checkout.html">Checkout</a>
        <a href="login.html">Login</a>
        
    </nav>

</header>


<div class="checkout-container">

    <div class="checkout-box">

        <h2>🛒 Checkout</h2>

        <form>

            <label>Nama Pelanggan</label>

            <input
                type="text"
                id="namaPelanggan"
                placeholder="Masukkan nama lengkap"
            >


            <label>Nomor HP</label>

            <input
                type="text"
                id="nomorHP"
                placeholder="Masukkan nomor HP"
            >


            <label>Alamat Pengiriman</label>

            <textarea
                id="alamat"
                placeholder="Masukkan alamat lengkap"
            ></textarea>


            <label>Metode Pembayaran</label>

            <select id="metodePembayaran">

                <option value="COD (Bayar di Tempat)">
                    COD (Bayar di Tempat)
                </option>

                <option value="Transfer Bank">
                    Transfer Bank
                </option>

                <option value="QRIS">
                    QRIS
                </option>

            </select>


            <h3>Ringkasan Pesanan</h3>


            <table>

                <thead>

                    <tr>
                        <th>Produk</th>
                        <th>Jumlah</th>
                        <th>Subtotal</th>
                    </tr>

                </thead>


                <tbody id="checkoutList">

                </tbody>


                <tfoot>

                    <tr>

                        <th colspan="2">
                            Total
                        </th>

                        <th id="totalCheckout">
                            Rp0
                        </th>

                    </tr>

                </tfoot>

            </table>


            <button
                type="button"
                id="tombolPesan"
            >
                Pesan Sekarang
            </button>

        </form>

    </div>

</div>


<!-- =========================================
     MENAMPILKAN RINGKASAN PESANAN
========================================= -->

<script>

let keranjangCheckout =
    JSON.parse(localStorage.getItem("keranjang")) || [];

let isiCheckout = "";

let totalCheckout = 0;


keranjangCheckout.forEach(item => {

    let subtotal =
        item.harga * item.jumlah;

    totalCheckout += subtotal;


    isiCheckout += `
        <tr>

            <td>
                ${item.nama}
            </td>

            <td>
                ${item.jumlah} ikat
            </td>

            <td>
                Rp${subtotal.toLocaleString('id-ID')}
            </td>

        </tr>
    `;

});


document.getElementById("checkoutList").innerHTML =
    isiCheckout;


document.getElementById("totalCheckout").innerHTML =
    "Rp" + totalCheckout.toLocaleString('id-ID');

</script>


<!-- =========================================
     FIREBASE FIRESTORE
========================================= -->

<script type="module">

import {
    collection,
    addDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    db
} from "./firebase-config.js";



/* =========================================
   TOMBOL PESAN
========================================= */

const tombolPesan =
    document.getElementById("tombolPesan");


tombolPesan.addEventListener("click", async function() {


    /* =========================================
       AMBIL DATA PELANGGAN
    ========================================= */

    const nama =
        document.getElementById("namaPelanggan").value.trim();


    const hp =
        document.getElementById("nomorHP").value.trim();


    const alamat =
        document.getElementById("alamat").value.trim();


    const pembayaran =
        document.getElementById("metodePembayaran").value;



    /* =========================================
       CEK DATA PELANGGAN
    ========================================= */

    if (
        nama === "" ||
        hp === "" ||
        alamat === ""
    ) {

        alert(
            "Mohon lengkapi data pelanggan terlebih dahulu."
        );

        return;

    }



    /* =========================================
       AMBIL KERANJANG
    ========================================= */

    const keranjang =
        JSON.parse(
            localStorage.getItem("keranjang")
        ) || [];



    /* =========================================
       CEK KERANJANG
    ========================================= */

    if (keranjang.length === 0) {

        alert("Keranjang masih kosong.");

        return;

    }



    /* =========================================
       HITUNG TOTAL
    ========================================= */

    let total = 0;


    keranjang.forEach(item => {

        total +=
            item.harga * item.jumlah;

    });



    /* =========================================
       SIMPAN KE FIREBASE
    ========================================= */

    try {

        tombolPesan.disabled = true;

        tombolPesan.innerText =
            "Menyimpan Pesanan...";


        await addDoc(
            collection(db, "pesanan"),
            {

                namaPelanggan: nama,

                nomorHP: hp,

                alamat: alamat,

                metodePembayaran: pembayaran,

                pesanan: keranjang,

                total: total,

                status: "Menunggu",

                tanggal:
                    new Date().toISOString()

            }
        );


        /* =========================================
           BERHASIL
        ========================================= */

        alert(
            "Pesanan berhasil dibuat!"
        );


        localStorage.removeItem(
            "keranjang"
        );


        window.location.href =
            "index.html";


    } catch (error) {


        console.error(
            "Error menyimpan pesanan:",
            error
        );


        alert(
            "Pesanan gagal disimpan. Silakan coba lagi."
        );


        tombolPesan.disabled = false;

        tombolPesan.innerText =
            "Pesan Sekarang";

    }

});

</script>


<!-- =========================================
     SCRIPT WEBSITE
========================================= -->

<script src="script.js"></script>


</body>
</html>
